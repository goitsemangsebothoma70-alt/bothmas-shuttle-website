<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Driver Dashboard - Bothmas Shuttle</title>
</head>
<body>
    <div class="container" style="padding: 40px; text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <img src="logo.png" alt="Bothmas Shuttle Logo" style="width: 60px; margin-bottom: 10px;">
        <h1 style="color: #512da8; margin-bottom: 10px;">Driver Dashboard</h1>
        <p id="welcome-msg" style="font-size: 16px; margin-bottom: 20px;">Welcome driver!</p>
        <p>Manage your trips and view assigned passenger routes here.</p>
        
        <div style="margin-top: 30px;">
            <button onclick="logout()" style="background-color: #d32f2f; color: #fff; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-weight: 600;">Sign Out</button>
        </div>
    </div>

    <script>
        // Check who is logged in from session storage
        const user = JSON.parse(sessionStorage.getItem('currentUser'));
        if (!user || user.role !== 'driver') {
            alert("Unauthorized access! Please log in as a driver.");
            window.location.href = "index.html";
        } else {
            document.getElementById('welcome-msg').innerText = `Welcome back, Captain ${user.name}!`;
        }

        function logout() {
            sessionStorage.removeItem('currentUser');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
